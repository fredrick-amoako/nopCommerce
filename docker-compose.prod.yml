# nopCommerce Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up --build -d

services:
  nopcommerce:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nopcommerce_app
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # NOTE: nopCommerce does NOT use standard ASP.NET ConnectionStrings.
      # Database connection is configured via the install wizard on first boot
      # and stored in App_Data/appsettings.json (persisted via Docker volume).
      - DOTNET_GCHeapHardLimit=800000000  # ~800MB heap limit within 1GB container
    ports:
      - "127.0.0.1:5000:80"  # Bind only to localhost; Nginx will proxy to this
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nopcommerce_app_data:/app/App_Data
      - nopcommerce_plugins:/app/Plugins
      - nopcommerce_images:/app/wwwroot/images
      - nopcommerce_logs:/app/logs
    networks:
      - nopcommerce_network
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      # Uses the /health endpoint from HealthCheckStartup.cs
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # nopCommerce takes ~60-90s to start on first boot

  db:
    image: postgres:15-alpine
    container_name: nopcommerce_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nopcommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTE: Do NOT expose port 5432 to the host in production.
    # PostgreSQL is only reachable within the Docker network.
    networks:
      - nopcommerce_network
    mem_limit: 400m
    memswap_limit: 400m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "nopcommerce"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  nopcommerce_app_data:
    name: nopcommerce_app_data
  nopcommerce_plugins:
    name: nopcommerce_plugins
  nopcommerce_images:
    name: nopcommerce_images
  nopcommerce_logs:
    name: nopcommerce_logs
  postgres_data:
    name: nopcommerce_postgres_data

networks:
  nopcommerce_network:
    driver: bridge
    name: nopcommerce_network
